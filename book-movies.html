<script>
  // When you have the real links, fill these in and the "coming soon" text
  // and hidden buttons above will switch over automatically.
  const BOOK_URL = "https://www.amazon.com/dp/1532050496";

  function wireUp(url, linkId, cardId, label) {
    if (!url) return;
    const link = document.getElementById(linkId);
    link.href = url;
    link.style.display = "inline-block";
    document.querySelector(`#${cardId} p`).textContent = label;
  }
  wireUp(BOOK_URL, "book-link", "card-book", "Available now.");
</script>
